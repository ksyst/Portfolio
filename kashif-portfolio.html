        *{ scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
        ::-webkit-scrollbar{ width:6px; height:6px }
        ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.14); border-radius: 999px }
        html{ scroll-behavior:smooth }
        body{ background:#06070a; margin:0 }
        .font-display{ font-family: "Syne", "Space Grotesk", system-ui, sans-serif; }
        .font-ui{ font-family: "Space Grotesk", system-ui, sans-serif; }

        /* FIX 2 - layering */
        .bg-layer{ pointer-events:none !important; z-index:0; opacity:1; }
        .bg-layer *{ pointer-events:none !important; }
        #home, #work{ position:relative; z-index:2; }
        .pill-btn{ z-index:10; pointer-events:auto !important; cursor:pointer; }

        /* FIX 1 - intro black is outside React flow but styled here too */
        #intro-black{ position:fixed; inset:0; background:#000; z-index:9999; opacity:1; }

        /* Grain SVG feTurbulence opacity 0.04 */
        .grain{ position:absolute; inset:0; overflow:hidden; pointer-events:none; opacity:0.04; }
        .grain svg{ width:100%; height:100%; }

        /* glass text */
        .glass-text{
          position:relative;
          color:#fff;
          text-shadow:
            0 0 20px rgba(255,255,255,0.5),
            0 0 40px rgba(180,190,255,0.15),
            0 20px 50px rgba(0,0,0,0.8);
          -webkit-text-stroke: 1px rgba(255,255,255,0.15);
        }
        .glass-reflect{
          position:absolute;
          top:100%;
          left:0; right:0;
          transform: scaleY(-1);
          opacity:0.16;
          filter: blur(1.2px);
          background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent 70%);
          -webkit-background-clip:text;
          background-clip:text;
          color: transparent;
          pointer-events:none;
          mask-image: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent 75%);
          margin-top: 8px;
        }

        .masonry{ column-count:1; column-gap:18px; }
        @media(min-width:640px){ .masonry{ column-count:2 } }
        @media(min-width:980px){ .masonry{ column-count:3 } }
        .masonry-item{ break-inside:avoid; margin-bottom:18px }

        /* placeholder gradient for EDIT */
        .placeholder-card{
          background:
            radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,0.14), transparent 42%),
            radial-gradient(100% 100% at 80% 80%, rgba(140,160,210,0.18), transparent 44%),
            linear-gradient(160deg, #171a22, #0e1016 55%, #1b1f2b);
        }
        .card-hover{ transition: transform 0.6s cubic-bezier(.2,.8,.2,1), border-color 0.4s ease, box-shadow 0.4s ease; }
        .card-hover:hover{ transform: scale(1.03); }

        /* bokeh */
        .bokeh-dot{ position:absolute; border-radius:999px; pointer-events:none; }
